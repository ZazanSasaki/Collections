<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Sasaki's Collection Store</title><link rel="stylesheet" href="/admin.css"></head><body><header><a href="/" class="brand">SASAKI'S <span>COLLECTION STORE</span></a><a href="/">← View storefront</a></header><main><section id="loginPanel" class="panel login"><p class="eyebrow">PRIVATE CONTROL ROOM</p><h1>Admin <em>access.</em></h1><form id="loginForm"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button>Enter dashboard ↗</button><p id="loginMessage"></p></form></section><section id="dashboard" class="hidden"><div class="dash-head"><div><p class="eyebrow">STORE MANAGEMENT</p><h1>Control <em>room.</em></h1></div><button id="adminLogout" class="secondary">Log out</button></div><div class="stats" id="stats"></div><div class="dash-grid"><section class="panel"><h2>Add a product</h2><form id="productForm"><label>Product name<input name="name" required></label><div class="two"><label>Category<input name="category" required placeholder="Accessories"></label><label>Price (PKR)<input name="price" type="number" min="0" required></label></div><div class="two"><label>Stock<input name="stock" type="number" min="0" required></label><label>Image URL<input name="image" type="url"></label></div><label>Description<textarea name="description" rows="3"></textarea></label><label class="check"><input type="checkbox" name="featured"> Featured product</label><button>Add product</button><p id="productMessage"></p></form></section><section class="panel"><h2>Products</h2><div id="adminProducts"></div></section></div><section class="panel orders"><h2>Customer orders</h2><div id="adminOrders"></div></section></section></main><script src="/admin.js"></script></body></html>
